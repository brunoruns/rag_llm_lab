# Dependency version updates voor het RAG LLM Labo
version: 2
updates:
  # Devcontainer image + features
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly

  # Python dependencies (bron van waarheid: pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
